[project]
name = "dxlora"
version = "0.1.0"
description = "Command line tool for the DX-LR22-900T22D LoRa module (AT command set over UART)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
dxlora = "dxlora.cli:entrypoint"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dxlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
