[project]
name = "zephyr-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "api-generator",
    "grpcio-tools>=1.70.0",
    "protorpc",
    "protorpcheader",
    "systemrpc",
    "rtosutils",
    "fsapi",
    "trace-tool",
    "tracemodule",
    "subscriber",
    "app-generator",
    "dxlora",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
dxlora = { path = "dxlora", editable = true }
protorpc = { path = "protorpc", editable = true }
api-generator = { path = "api_generator", editable = true }
protorpcheader = { path = "protorpcheader", editable = true }
systemrpc = { path = "systemrpc", editable = true }
rtosutils = { path = "rtosutils", editable = true }
fsapi = { path = "fsapi", editable = true }
trace-tool = { path = "trace_tool", editable = true }
tracemodule = { path = "tracemodule", editable = true }
subscriber = { path = "subscriber", editable = true }
app-generator = { path = "app_generator", editable = true }

[tool.uv]
package = false
